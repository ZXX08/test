### model
model_name_or_path: /root/lnj/models/Qwen3.5-2B
image_max_pixels: 262144
video_max_pixels: 16384
video_maxlen: 32
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true
freeze_multi_modal_projector: false
freeze_language_model: false
deepspeed: examples/deepspeed/ds_z3_config.json

### dataset
# 注:TDBench 系列已确认不使用;AVI-Math 用 AVI-Math1(10k 版);O3DVQA 为单个数据集(非 O3DVQA1-7)
dataset: [AVI-Math1, FloodNet, LIDA_train, LIDA_val,
          AirCopBench1, AirCopBench2, AirCopBench3, AirCopBench4,
          AVVG_train_det, AVVG_train, RSVG_train, RSVG_val,
          DIOR_RSVG, VRSBench, GeoZero1, GeoZero2,
          O3DVQA, UrbanVideo,
          OpenFly_airsim_16, OpenFly_airsim_18, OpenFly_airsim_23, OpenFly_airsim_26,
          OpenFly_airsim_gz, OpenFly_airsim_sh, OpenFly_gs_ecust, OpenFly_gs_nwpu01,
          OpenFly_gs_nwpu02, OpenFly_gs_sjtu01, OpenFly_ue_bigcity
          ]
template: qwen3_5
cutoff_len: 2048
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/qwen3.5_sft
logging_steps: 10
save_steps: 1000
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none  # choices: [none, wandb, tensorboard, swanlab, mlflow]

### train
per_device_train_batch_size: 8
gradient_accumulation_steps: 2
learning_rate: 1.0e-05
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

